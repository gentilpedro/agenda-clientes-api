name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-api
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenda_clientes
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda_clientes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Versão real (semver), calculada a partir dos commits desde a última tag
      # vX.Y.Z — ver release-standards. should_release=false quando não há
      # commit feat/fix/breaking desde a última release (nada a publicar).
      - name: Compute next version
        id: version
        run: |
          set +e
          VERSION=$(bash .github/scripts/next-version.sh)
          STATUS=$?
          set -e
          if [ $STATUS -eq 2 ]; then
            echo "Nenhum commit feat/fix/breaking desde a última tag — pulando release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ $STATUS -ne 0 ]; then
            echo "::error::Falha ao calcular a próxima versão (veja o log acima)"
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # Só ajusta o pom pra essa build carregar o número de versão real no
      # nome do jar; o pom.xml do repositório continua com -SNAPSHOT (versão
      # de desenvolvimento) — essa mudança não é commitada de volta.
      - name: Set project version for the build
        if: steps.version.outputs.should_release == 'true'
        run: ./mvnw -q versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build, test and package
        run: ./mvnw -B package

      - name: Create tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Create release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: target/*.jar

  # Deploy na VPS (https://agenda-api.aamora.com.br) — skill deploy-vps. Fica aqui, e não num
  # workflow disparado pela tag, porque tag criada com o GITHUB_TOKEN não dispara outro workflow.
  # A imagem é montada aqui e enviada por SSH com docker save, sem registry. A VPS_SSH_KEY só
  # consegue rodar "app-deploy agenda-api" no servidor (forced command): não abre shell, não lê
  # arquivos, não mexe em outra app.
  deploy-vps:
    name: Deploy na VPS
    needs: build-test-release
    if: needs.build-test-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Nunca dois deploys ao mesmo tempo, e nunca cancelar um pela metade.
    concurrency:
      group: deploy-vps-agenda-api
      cancel-in-progress: false
    environment:
      name: vps
      url: https://agenda-api.aamora.com.br
    env:
      APP: agenda-api
      VERSION: ${{ needs.build-test-release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.build-test-release.outputs.version }}

      - name: Montar a imagem
        run: |
          docker build -f deploy/vps/Dockerfile --build-arg VERSAO="$VERSION" -t "$APP:$VERSION" .
          docker save "$APP:$VERSION" | gzip > image.tar.gz
          ls -lh image.tar.gz

      # VPS_KNOWN_HOSTS fixa a chave do servidor: sem ela o ssh aceitaria qualquer host que
      # respondesse no IP, e a imagem (e os segredos) iriam para quem estivesse lá.
      - name: Configurar o SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Mesmos nomes do SECRETS em deploy/vps/deploy.conf. Valores de uma linha só, sem aspas
      # simples. APP_CORS_ALLOWED_ORIGINS não é segredo: vem de variável do repositório.
      - name: Enviar os segredos
        env:
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_CORS_ALLOWED_ORIGINS: ${{ vars.APP_CORS_ALLOWED_ORIGINS }}
        run: |
          for nome in APP_JWT_SECRET APP_CORS_ALLOWED_ORIGINS; do
            [ -n "${!nome}" ] || { echo "::error::$nome não cadastrado no repositório"; exit 1; }
            printf '%s=%s\n' "$nome" "${!nome}"
          done | ssh -o BatchMode=yes "deploy@${{ secrets.VPS_HOST }}" set-secrets

      - name: Enviar a imagem
        run: ssh -o BatchMode=yes "deploy@${{ secrets.VPS_HOST }}" load-image "$VERSION" < image.tar.gz

      # O app-deploy espera o container ficar saudável e volta para a versão anterior se não ficar.
      - name: Subir a versão
        run: ssh -o BatchMode=yes "deploy@${{ secrets.VPS_HOST }}" up "$VERSION"

      # Confere de fora, pelo caminho real (Cloudflare → Nginx → container).
      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 10 -o /dev/null https://agenda-api.aamora.com.br/actuator/health; then echo "ok"; exit 0; fi
            sleep 10
          done
          echo "::error::https://agenda-api.aamora.com.br/actuator/health não respondeu depois do deploy."
          exit 1
