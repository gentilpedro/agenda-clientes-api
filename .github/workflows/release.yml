name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-api
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenda_clientes
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda_clientes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Versão real (semver), calculada a partir dos commits desde a última tag
      # vX.Y.Z — ver release-standards. should_release=false quando não há
      # commit feat/fix/breaking desde a última release (nada a publicar).
      - name: Compute next version
        id: version
        run: |
          set +e
          VERSION=$(bash .github/scripts/next-version.sh)
          STATUS=$?
          set -e
          if [ $STATUS -eq 2 ]; then
            echo "Nenhum commit feat/fix/breaking desde a última tag — pulando release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ $STATUS -ne 0 ]; then
            echo "::error::Falha ao calcular a próxima versão (veja o log acima)"
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # Só ajusta o pom pra essa build carregar o número de versão real no
      # nome do jar; o pom.xml do repositório continua com -SNAPSHOT (versão
      # de desenvolvimento) — essa mudança não é commitada de volta.
      - name: Set project version for the build
        if: steps.version.outputs.should_release == 'true'
        run: ./mvnw -q versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build, test and package
        run: ./mvnw -B package

      - name: Create tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Create release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: target/*.jar
