name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-api
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenda_clientes
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda_clientes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and package
        run: ./mvnw -B package

      - name: Read project version
        id: version
        run: |
          VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          VERSION=${VERSION%-SNAPSHOT}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          generate_release_notes: true
          files: target/*.jar
