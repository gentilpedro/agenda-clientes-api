# agenda-api — lido pelo app-deploy e pelo app-backup na VPS (cópia em /opt/agenda-api/deploy.conf).

# Porta em 127.0.0.1 onde o serviço web atende (a mesma do docker-compose.yml e do nginx.conf).
PORT=5101

# Caminho que responde 2xx com o app pronto (Actuator, inclui o banco). O deploy só vale depois
# dele; se não responder em ~60 s, o app-deploy volta para a versão anterior.
HEALTH_PATH=/actuator/health

# Nomes que o deploy pode gravar em secrets.env (separados por espaço).
# Têm de bater com o passo "Enviar os segredos" do release.yml.
SECRETS="APP_JWT_SECRET APP_CORS_ALLOWED_ORIGINS"

# Sem uploads: só o banco entra no backup diário.
BACKUP_VOLUMES=""
