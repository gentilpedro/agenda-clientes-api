spring.application.name=agenda-clientes-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/agenda_clientes
spring.datasource.username=agenda
spring.datasource.password=agenda

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=http://localhost:3000

# Valor padrão apenas para desenvolvimento local. Em produção, sobrescrever
# via variável de ambiente APP_JWT_SECRET com um valor secreto real (min. 32 bytes).
app.jwt.secret=troque-esta-chave-super-secreta-em-producao-min-32-bytes
app.jwt.expiration-minutes=1440

# Documentação OpenAPI: http://localhost:8080/swagger-ui.html
# A versão exibida na doc vem do pom.xml (filtro de recursos do Maven).
app.version=@project.version@
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# A doc é pública (liberada na SecurityConfig). Em produção, desabilitar via
# variáveis de ambiente: SPRINGDOC_API_DOCS_ENABLED=false e
# SPRINGDOC_SWAGGER_UI_ENABLED=false

# Meta / WhatsApp Cloud API (Tech Provider, Embedded Signup). app-id/app-secret
# ficam vazios até o App da Meta ser criado. Em produção, sobrescrever via
# APP_WHATSAPP_APP_ID / APP_WHATSAPP_APP_SECRET / APP_WHATSAPP_WEBHOOK_VERIFY_TOKEN.
app.whatsapp.app-id=
app.whatsapp.app-secret=
app.whatsapp.webhook-verify-token=troque-este-valor-em-producao
app.whatsapp.graph-api-version=v21.0
app.whatsapp.template-name=confirmacao_agendamento
app.whatsapp.reminder-lead-time-minutes=1440
app.whatsapp.reminder-check-interval-ms=300000

# Chave usada para cifrar (AES-256-GCM) o token de acesso do WhatsApp de cada
# consultório em repouso. Valor abaixo é só para desenvolvimento local; em
# produção sobrescrever via APP_SECURITY_ENCRYPTION_KEY com um valor secreto real.
app.security.encryption-key=troque-esta-chave-de-32-bytes-em-producao!!
